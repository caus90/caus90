  <rect x="22" y="50" width="356" height="8" rx="4" fill="#161b22"/>
  <g clip-path="url(#bar)"><rect x="22.0" y="50" width="188.9" height="8" fill="#3572A5"/><rect x="210.9" y="50" width="166.3" height="8" fill="#f1e05a"/><rect x="377.2" y="50" width="1.0" height="8" fill="#C1F12E"/></g>

<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <clipPath id="frame"><rect width="850" height="260" rx="12"/></clipPath>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset=".3" stop-color="#0d1117" stop-opacity=".85"/>
      <stop offset=".7" stop-color="#0d1117" stop-opacity=".85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity=".35"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .rain { font: 700 15px 'Courier New', monospace; fill: #00ff41; animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    .head { fill: #d1ffd9; }
    @keyframes fall { from { transform: translateY(-270px); } to { transform: translateY(270px); } }
    .title { font: 700 78px 'Courier New', monospace; text-anchor: middle; letter-spacing: 6px; }
    .main { fill: #00ff41; animation: flicker 6s infinite; }
    .red  { fill: #ff0055; opacity: 0; animation: glitchA 3.2s infinite steps(1); }
    .cyan { fill: #00e5ff; opacity: 0; animation: glitchB 3.2s infinite steps(1); }
    @keyframes glitchA { 0%,88%,100% { opacity: 0; transform: none; } 89% { opacity: .8; transform: translate(-5px,2px); } 91% { transform: translate(4px,-1px); } 93% { transform: translate(-2px,0); } 95% { opacity: 0; } }
    @keyframes glitchB { 0%,88%,100% { opacity: 0; transform: none; } 89% { opacity: .8; transform: translate(5px,-2px); } 91% { transform: translate(-4px,1px); } 93% { transform: translate(2px,0); } 95% { opacity: 0; } }
    @keyframes flicker { 0%,100% { opacity: 1; } 89% { opacity: 1; } 90% { opacity: .4; } 91% { opacity: 1; } 92% { opacity: .6; } 93% { opacity: 1; } }
    .sub { font: 700 17px 'Courier New', monospace; fill: #c9d1d9; text-anchor: middle; letter-spacing: 2px; }
    .prompt { font: 700 14px 'Courier New', monospace; fill: #00ff41; }
    .dim { fill: #8b949e; }
    .cursor { animation: blink 1s infinite steps(1); }
    @keyframes blink { 50% { opacity: 0; } }
    .status { font: 700 12px 'Courier New', monospace; fill: #00ff41; text-anchor: end; animation: blink 2s infinite steps(1); }
    .scan { animation: scan 5s linear infinite; }
    @keyframes scan { from { transform: translateY(-20px); } to { transform: translateY(270px); } }
  </style>
